name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Verify release source
        run: go run ./cmd/pushguard ready --non-interactive
      - name: Run race detector
        run: go test -race -count=1 ./...
      - name: Build release archives and checksums
        env:
          PUSHGUARD_BUILD_COMMIT: ${{ github.sha }}
          PUSHGUARD_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: go run ./cmd/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "PushGuard $GITHUB_REF_NAME" --generate-notes
